<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3456"/>
      <stop offset=".48" stop-color="#6f263d"/>
      <stop offset="1" stop-color="#1d5486"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e9ec"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f4"/>
      <stop offset="1" stop-color="#8d979b"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14060c" flood-opacity=".45"/>
    </filter>
    <path id="spade" d="M0,-60 C34,-26 66,-4 50,28 C40,46 16,46 7,32 L20,64 L-20,64 L-7,32 C-16,46 -40,46 -50,28 C-66,-4 -34,-26 0,-60 Z"/>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <!-- mountain range -->
    <path d="M0,835 L150,700 L230,760 L380,600 L470,690 L560,610 L690,740 L800,650 L1024,820 L1024,1024 L0,1024 Z" fill="#123f66" opacity=".85"/>
    <path d="M380,600 L340,638 L362,646 L385,630 L404,650 L425,642 Z M800,650 L768,676 L790,682 L806,670 L824,684 L838,680 Z M150,700 L122,725 L142,730 L158,718 L172,728 Z" fill="#f6f7f8" opacity=".85"/>
    <path d="M0,905 L120,840 L260,900 L420,820 L560,880 L720,810 L880,880 L1024,840 L1024,1024 L0,1024 Z" fill="#0b2744"/>
    <!-- chip -->
    <g transform="translate(700,700)" filter="url(#sh)">
      <circle r="190" fill="url(#chip)"/>
      <circle r="190" fill="none" stroke="#6f263d" stroke-width="44" stroke-dasharray="62 62" opacity=".95"/>
      <circle r="132" fill="#6f263d"/>
      <circle r="132" fill="none" stroke="#f6f7f8" stroke-width="6" stroke-dasharray="14 12"/>
      <circle r="98" fill="#236192"/>
    </g>
    <!-- card -->
    <g transform="translate(450,470) rotate(-9)" filter="url(#sh)">
      <rect x="-230" y="-320" width="460" height="640" rx="44" fill="url(#card)"/>
      <rect x="-206" y="-296" width="412" height="592" rx="30" fill="none" stroke="#236192" stroke-opacity=".35" stroke-width="4"/>
      <text x="-168" y="-196" font-family="Caladea, 'DejaVu Serif', Georgia, serif" font-weight="700" font-size="112" fill="#111417" text-anchor="middle">2</text>
      <use href="#spade" transform="translate(-168,-130) scale(.62)" fill="#111417"/>
      <use href="#spade" transform="translate(0,-130) scale(1.7)" fill="#111417"/>
      <use href="#spade" transform="translate(0,150) rotate(180) scale(1.7)" fill="#111417"/>
      <g transform="rotate(180)">
        <text x="-168" y="-196" font-family="Caladea, 'DejaVu Serif', Georgia, serif" font-weight="700" font-size="112" fill="#111417" text-anchor="middle">2</text>
        <use href="#spade" transform="translate(-168,-130) scale(.62)" fill="#111417"/>
      </g>
    </g>
    <!-- top sheen -->
    <rect width="1024" height="1024" rx="228" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="10"/>
  </g>
</svg>
